[package]
name = "horosa-desktop-installer"
version = "3.9.1"
description = "Horosa macOS desktop shell"
authors = ["Horosa"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
# [剪贴板] 原生 NSPasteboard/CF_UNICODETEXT 直写(GUI 无 locale 时 pbcopy 按 MacRoman 解读 stdin 致乱码);
# 关 image 特性 → macOS 传递依赖(objc2 三件)全在 tauri 树,净新增仅本 crate;Windows 未来直接复用
arboard = { version = "3", default-features = false }
base64 = "0.22"
flate2 = "1"
# [U-A kill-atomic] renamex_np(RENAME_SWAP) 原子互换目录;0.2 已在 tauri 依赖树,零新增传递依赖
libc = "0.2"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = [] }
tiny_http = "0.12"
urlencoding = "2"
walkdir = "2.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true

[features]
# 本地假 release 全链路验证(verify_update_experience_local.sh):
# 仅开发构建启用,发布二进制不带 → 「出站仅 GitHub」铁律不破。
update-url-override = []
